<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UMDB has moved to UMA</title>
  <link rel="canonical" href="https://aglucaci.github.io/UMA/" />
  <script>
    // The UMDB website is now UMA (github.com/aglucaci/UMA). Keep the page, query and hash:
    // /UMDB/study.html?acc=X -> /UMA/study.html?acc=X, /UMDB/study/X -> /UMA/study/X.
    var rest = location.pathname.replace(/^\/UMDB/, "");
    location.replace("https://aglucaci.github.io/UMA" + rest + location.search + location.hash);
  </script>
</head>
<body style="font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem">
  <p>The Urban Microbiome Database website is now <a href="https://aglucaci.github.io/UMA/">UMA</a>.</p>
  <p>Harvesting code: <a href="https://github.com/aglucaci/UMDB">UMDB</a> · analyses: <a href="https://github.com/aglucaci/STRIGA">STRIGA</a> · website: <a href="https://github.com/aglucaci/UMA">UMA</a>.</p>
</body>
</html>
