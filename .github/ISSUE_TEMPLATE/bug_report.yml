name: Bug report
description: Something in the harvester, database or releases does not work (website bugs: github.com/aglucaci/UMA/issues)
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Harvester / CLI
        - Release files
        - GitHub Actions workflow
        - Downloaded data files
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For the harvester, include the exact command and its output. For a release, its version and the file.
      render: shell
  - type: input
    id: env
    attributes:
      label: Browser or Python version / OS
  - type: markdown
    attributes:
      value: "**Never paste API keys or `.env` contents.** Security issues go through the Security tab, not here."
