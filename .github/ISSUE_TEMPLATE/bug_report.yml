name: Bug report
description: Something on the website or in the harvester does not work
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Website
        - Harvester / CLI
        - GitHub Actions workflow
        - Downloaded data files
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For the website, include the page URL and filters. For the harvester, include the exact command and its output.
      render: shell
  - type: input
    id: env
    attributes:
      label: Browser or Python version / OS
  - type: markdown
    attributes:
      value: "**Never paste API keys or `.env` contents.** Security issues go through the Security tab, not here."
